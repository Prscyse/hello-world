plugins {
    id 'com.android.application'
}

android {
    namespace 'org.jardincentral.app'
    compileSdk 36

    defaultConfig {
        applicationId 'org.jardincentral.app'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
        }
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
    }
}

dependencies {
    implementation 'androidx.core:core:1.17.0'
}
