name: Build Jardin Central Android APK

on:
  push:
    branches:
      - build/jardincentral-android-v1
    paths:
      - 'jardincentral-android-v1/**'
      - '.github/workflows/build-jardincentral-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Build debug APK
        working-directory: jardincentral-android-v1
        run: gradle --no-daemon --stacktrace clean assembleDebug

      - name: Rename APK
        run: cp jardincentral-android-v1/app/build/outputs/apk/debug/app-debug.apk JardinCentral_Android_v1_debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: JardinCentral_Android_v1_debug
          path: JardinCentral_Android_v1_debug.apk
          if-no-files-found: error
          retention-days: 7
