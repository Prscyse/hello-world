name: Build Jardín Central APK

on:
  push:
    branches:
      - build-jardin-central-apk-0.1.0
    paths:
      - '.github/workflows/build-jardin-central-apk.yml'
      - 'android-apk-build/**'
  pull_request:
    branches:
      - master
    paths:
      - '.github/workflows/build-jardin-central-apk.yml'
      - 'android-apk-build/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore Android project
        shell: bash
        run: |
          set -Eeuxo pipefail
          mkdir -p android-project
          base64 --decode android-apk-build/project.tar.gz.b64 | tar -xzf - -C android-project
          find android-project -maxdepth 4 -type f | sort | sed -n '1,200p'
          SETTINGS="$(find android-project -maxdepth 5 -type f -name 'settings.gradle.kts' -print -quit)"
          test -n "$SETTINGS"
          PROJECT_DIR="$(dirname "$SETTINGS")"
          test -f "$PROJECT_DIR/gradlew"
          chmod +x "$PROJECT_DIR/gradlew"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build debug APK
        shell: bash
        run: |
          set -Eeuxo pipefail
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Prepare APK artifact
        shell: bash
        run: |
          set -Eeuxo pipefail
          APK="$(find "$PROJECT_DIR/app/build/outputs/apk/debug" -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          mkdir -p output
          cp "$APK" 'output/Jardin-Central-Alpha-0.1.0-debug.apk'
          sha256sum 'output/Jardin-Central-Alpha-0.1.0-debug.apk' | tee 'output/Jardin-Central-Alpha-0.1.0-debug.apk.sha256'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Jardin-Central-APK-Alpha-0.1.0
          path: output/*
          if-no-files-found: error
          retention-days: 7
